[project]
name = "vichara"
version = "0.1.0"
description = "A study agent that plans, calls tools, and cites its sources -- evaluated on its trajectory, not just its answer."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Neha Bharti" }]
requires-python = ">=3.11,<3.13"

# Runtime dependencies only. The evaluation harness (matplotlib, pandas) and
# the judge model live in the `eval` group: they add weight to the deployed
# image for code that never runs when serving a query.
dependencies = [
    # Agent graph. The checkpointer is a separate distribution from langgraph
    # itself and is what makes a run resumable and inspectable -- without it
    # the interrupt-based approval flow in guardrails/approval.py cannot work.
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "langchain-core>=0.3,<2.0",
    # Provider. Every model call routes through llm/provider.py; this is the
    # only place a vendor SDK is imported, so switching providers is a config
    # change rather than a refactor.
    "langchain-google-genai>=2.0,<4.0",
    # Tools. httpx serves both the VidyaRAG retrieval client and web search;
    # declared directly rather than relied on transitively.
    "httpx>=0.27,<1.0",
    # Service
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "gradio>=5.0,<6.0",
    # Config / plumbing
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "python-dotenv>=1.0,<2.0",
    "pyyaml>=6.0,<7.0",
    "tenacity>=9.0,<10.0",
    "structlog>=24.4,<26.0",
    "typer>=0.15,<1.0",
    "rich>=13.9,<15.0",
]

[project.urls]
Homepage = "https://github.com/NehaBharti08/vichara"
Repository = "https://github.com/NehaBharti08/vichara"

[project.scripts]
vichara = "vichara.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.8,<1.0",
    "black>=24.10,<26.0",
    "mypy>=1.13,<2.0",
    "pre-commit>=4.0,<5.0",
    "types-pyyaml>=6.0,<7.0",
    "respx>=0.22,<1.0",
]

# Reporting only. Kept out of the runtime set so the Space image does not carry
# a plotting stack it never imports.
eval = [
    "pandas>=2.2,<3.0",
    "matplotlib>=3.9,<4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vichara"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # unused arguments
    "SIM",  # flake8-simplify
    "TID",  # tidy imports
    "PTH",  # prefer pathlib
    "BLE",  # blind except - allowed only where explicitly justified with noqa
    "RUF",
]
ignore = [
    "E501",   # line length is black's job
    "B008",   # FastAPI Depends() in defaults is idiomatic
    # Word lists (stopwords, reserved device names) read better as a split
    # string than as a forty-element list literal. The rule is a style
    # preference and this codebase has the opposite one.
    "SIM905",
]

[tool.ruff.lint.per-file-ignores]
# Stubs handed to monkeypatch must match the signature they replace, so unused
# parameters are inherent rather than accidental.
"tests/**" = ["ARG001", "ARG002", "ARG005"]

[tool.black]
line-length = 100
target-version = ["py311"]

# mypy runs strict on the core package only. Tests and scripts are exploratory
# by nature; forcing strict typing there buys noise, not safety.
[tool.mypy]
python_version = "3.11"
files = ["src/vichara"]
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "gradio.*",
    "langgraph.*",
    "langchain_google_genai.*",
    # Optional: the OpenAI adapter is implemented and tested but the SDK is
    # not a runtime dependency, so the module is legitimately absent here.
    "langchain_openai.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "integration: touches a live external service (deselect with '-m \"not integration\"')",
    "costly: consumes model-provider quota (deselect with '-m \"not costly\"')",
    "sandbox: needs a working Node runtime for the Pyodide backend",
    "slow: takes more than a few seconds (package loading, cold starts)",
    "docker: needs a working Docker daemon; runs in CI, not on a dev laptop",
]

[tool.coverage.run]
source = ["src/vichara"]
branch = true
