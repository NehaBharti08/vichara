name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · types · tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # No credentials are set here, deliberately. The suite must pass with an
    # empty environment: that is what proves the fixture backends work and that
    # the agent degrades rather than crashing when a service is undeployed. A
    # key in CI would let a test start silently depending on a live provider.

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.11

      # The Pyodide sandbox backend is hosted by Node, and it is the default
      # backend everywhere -- so without this the sandbox suite silently skips
      # and the security claims in docs/THREAT_MODEL.md go untested.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          uv sync --frozen
          npm ci

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (black)
        run: uv run black --check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Tests
        run: uv run pytest -m "not costly" --cov --cov-report=term-missing

      - name: Health check
        run: uv run vichara health

  docker-sandbox:
    name: sandbox conformance (docker backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The Docker backend is implemented in full but is not the default and is
    # not expected to run on a developer laptop. Ubuntu runners ship a working
    # daemon for free, so this is where it gets exercised -- the alternative is
    # a backend that compiles and is never run.
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Pre-pull the sandbox image
        run: docker pull python:3.11-slim

      - name: Sandbox conformance
        env:
          SANDBOX_BACKEND: docker
        run: uv run pytest tests/sandbox -q -m "sandbox or not sandbox"

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history, not just the diff
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
